name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Test suite is deterministic: no live model, network, or GPU dependency.
# Live-model runs remain manual (outside this workflow).
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest -r requirements-contracts.txt
      - run: python -m pytest tests/ -q
